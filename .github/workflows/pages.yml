name: Docs (GitHub Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Pages allows a single deployment at a time; queue rather than
# cancel so an in-flight deploy always completes.
concurrency:
  group: pages
  cancel-in-progress: false

# Least-privilege: only what actions/deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
          cache: pip

      - name: Install documentation dependencies
        run: pip install -r requirements.txt

      - name: Build site (strict)
        # --strict fails on broken internal links or nav-referenced
        # files that don't exist. Catches doc-rot at CI time rather
        # than silently deploying a broken page.
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
