# MkDocs Material config for the ithyno docs site.
#
# Deploys via .github/workflows/pages.yml on pushes to this repository's
# main branch. Local preview:
#   pip install -r requirements.txt
#   mkdocs serve
# Then browse http://localhost:8000/.
#
# `mkdocs build --strict` fails on broken nav references / broken
# internal links — the CI workflow uses --strict so doc-rot is caught
# at CI time.
site_name: ithyno
site_description: >-
  Local dashboard for OpenSpec — dispatches propose / apply / review /
  verify skills to AI CLI agents. Markdown underneath, a progress
  dashboard on top.
site_url: https://fluentdb-dev.github.io/ithyno-pages/
repo_url: https://github.com/fluentdb-dev/ithyno-pages
repo_name: fluentdb-dev/ithyno-pages
edit_uri: edit/main/docs/

# docs_dir: docs (implied default)

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/stylesheets/installation.css
  - assets/stylesheets/navigation.css
  - assets/stylesheets/content-images.css
  - assets/stylesheets/landing.css

extra_javascript:
  - assets/javascripts/installation-selector.js
  - assets/javascripts/sidebar-toggle.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: [., docs]

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ja
          name: 日本語
          link: /ja/
          build: true
          nav_translations:
            Home: ホーム
            Getting Started: はじめに
            Installation: インストール
            Start Simple Project: シンプルなプロジェクトを始める
            Set up multiple agents: 複数エージェントを設定する
            Multi-agent execution flow: マルチエージェント実行フロー
            Init & Import: 初期化とインポート
            Agent configuration (agents.yaml): エージェント設定（agents.yaml）
            Troubleshooting: トラブルシューティング
            Advanced: 高度な設定
            tmux and agmsg: tmuxとagmsg
            Architecture: アーキテクチャ
            Overview: 概要
            OpenSpec and agents: OpenSpecとエージェント
            OpenSpec Kanban: OpenSpec Kanban
            OpenSpec worktrees: OpenSpec worktree
            Git identity: Git identity
            Parallel shells: 並列Shell
            ADRs: ADR
            PENDING annotation position: PENDING注釈の位置
            Development: 開発
            Roadmap: ロードマップ
            Release process: リリース手順
            Skill capabilities: Skill機能
            Skill e2e manual verification: Skill E2E手動検証
            Migration guide: 移行ガイド

# Nav: public documentation mapped to sidebar sections. Internal planning
# notes stay in the application branches and are not shipped from pages.
nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Start Simple Project: project-creation-flow.md
      - Set up multiple agents: multi-agent-setup-and-dispatch.md
      - Multi-agent execution flow: multi-agent-execution-flow.md
      - Init & Import: user-manual-init-and-import.md
      - Agent configuration (agents.yaml): user-manual/multi-agent-cli.md
      - Troubleshooting: user-manual/troubleshooting.md
  - Advanced:
      - tmux and agmsg: advanced/tmux-and-agmsg.md
  - Architecture:
      - Overview: architecture.md
      - OpenSpec and agents: architecture/openspec-agent.md
      - OpenSpec Kanban: architecture/openspec-kanban.md
      - OpenSpec worktrees: architecture/openspec-worktree.md
      - Git identity: architecture/git-identity.md
      - Parallel shells: architecture/parallel-shells.md
      - ADRs:
          - PENDING annotation position: adr/2026-07-28-pending-annotation-position.md
  - Development:
      - Roadmap: roadmap.md
      - Release process: release.md
      - Skill capabilities: skill-capabilities.md
      - Skill e2e manual verification: skill-e2e-manual-verification.md
      - Migration guide: migration-guide.md
